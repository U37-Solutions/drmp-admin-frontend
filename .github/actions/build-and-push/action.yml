name: Build

inputs:
  DOCKER_REGISTRY_NAME:
    type: string
    required: true
  NAMESPACE:
    type: string
    required: true
  PROJECT_NAME:
    type: string
    required: true
  VITE_API_URL:
    type: string
    required: true
  VITE_SOCKET_URL:
    type: string
    required: true
  VITE_MAP_API_KEY:
    type: string
    required: true
  VITE_MAP_ID:
    type: string
    required: true

runs:
  using: 'composite'
  steps:
    - name: Build and push Docker image
      uses: docker/build-push-action@v3
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ inputs.DOCKER_REGISTRY_NAME }}/${{ inputs.NAMESPACE }}/${{ inputs.PROJECT_NAME }}:latest
        platforms: linux/amd64
        secrets: |
            VITE_MAP_API_KEY=${{ secrets.VITE_MAP_ID }}
            VITE_MAP_ID=${{ secrets.VITE_MAP_API_KEY }}
        build-args: |
          VITE_API_URL=${{ inputs.VITE_API_URL }}
          VITE_SOCKET_URL=${{ inputs.VITE_SOCKET_URL }}
